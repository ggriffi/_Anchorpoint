<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">

<header class="ap-header">
  <div class="ap-header-inner">
    <a href="/index.html" class="ap-brand">
      <picture>
        <source type="image/webp" srcset="/assets/logo-96.webp 96w, /assets/logo-192.webp 192w" sizes="42px">
        <img src="/assets/logo-96.webp" width="42" height="42" alt="AnchorPoint IT" class="ap-mark" decoding="async">
      </picture>
      <div class="ap-brand-text">
        <div class="ap-brand-name">Anchorpoint<span>-IT</span></div>
        <div class="ap-brand-tagline">Grounded IT for Growing Organizations</div>
      </div>
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
      <span></span><span></span><span></span>
    </button>

    <nav class="ap-nav" id="primary-nav" aria-label="Primary navigation">
      <a href="/services.html" data-nav="services">Services</a>
      <a href="/about.html" data-nav="about">About</a>
      <a href="/blog.html" data-nav="blog">Case Studies</a>
      <a href="/assess.html" data-nav="assess">Free Assessment</a>
      <a class="ap-btn ap-btn--primary" href="/consult.html">Book a Consult</a>
    </nav>
  </div>
</header>

<script>
  (function() {
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.ap-nav');
    if (!toggle || !nav) return;
    toggle.addEventListener('click', function() {
      const open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.ap-header')) {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
