<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consult | Anchorpoint-IT</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
            --card: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--card);
            margin-bottom: 40px;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            margin-left: 20px;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
        }

        input,
        textarea {
            background: var(--card);
            color: white;
        }

        button {
            background: var(--accent);
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            filter: brightness(1.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div style="font-size: 1.5em; font-weight: bold;">ANCHORPOINT<span style="color:var(--accent)">-IT</span>
            </div>
            <nav><a href="index.html">Home</a><a href="services.html">Services</a></nav>
        </header>

        <h2>Schedule a Consultation</h2>
        <p>Tell us about your current infrastructure challenges. We'll reach out to discuss a logical path forward.</p>

        <form action="#" method="POST">
            <label>Name</label><input type="text" name="name" required>
            <label>Email</label><input type="email" name="email" required>
            <label>Current Setup / Pain Points</label>
            <textarea name="message" rows="5"></textarea>
            <button type="submit">Send Request</button>
        </form>
    </div>
</body>

</html>
