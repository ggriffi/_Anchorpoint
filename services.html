<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Services — AnchorPoint IT</title>
    <meta name="description" content="AnchorPoint IT services — grounded, reliable IT for growing organizations." />

    <link rel="icon" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />

    <style>
        /* Page shell (keeps it consistent even if styles.css changes) */
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 16px 56px;
        }

        .pageHeader {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
        }

        .pageHeader h1 {
            margin: 0;
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            letter-spacing: -0.02em;
        }

        .pageHeader p {
            margin: 0;
            max-width: 70ch;
            opacity: 0.85;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        /* If your styles.css already defines .btn/.btnSecondary these will just inherit */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
        }

        .btnPrimary {
            background: #0f4c63;
            color: #fff;
        }

        .btnSecondary {
            background: rgba(255, 255, 255, 0.55);
            color: #0b2230;
            border: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(6px);
        }

        /* The main poster image */
        .posterWrap {
            margin-top: 18px;
        }

        .poster {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.10),
                0 2px 6px rgba(0, 0, 0, 0.06);
            background: #fff;
        }

        /* Optional: small footer line like homepage */
        .pageFooter {
            margin-top: 18px;
            text-align: center;
            opacity: 0.75;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="pageHeader">
            <h1>Services</h1>
            <p>Reliable, secure, and scalable IT—built to support growing organizations.</p>

            <div class="actions">
                <!-- Update href to your real consult link (Calendly, form, mailto, etc.) -->
                <a class="btn btnPrimary btnPrimary" href="/contact.html">Request a consult</a>
                <a class="btn btnSecondary btnSecondary" href="/index.html">Back to Home</a>
            </div>
        </header>

        <section class="posterWrap" aria-label="Services overview">
            <!-- If the file is in /assets/ change src to /assets/services.png -->
            <img class="poster" src="/assets/services.png" alt="AnchorPoint IT services overview" loading="eager" />
        </section>

        <div class="pageFooter">
            Clear solutions. Built to last.
        </div>
    </main>
</body>

</html>
